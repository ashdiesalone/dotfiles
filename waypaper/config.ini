[Settings]
folder = ~/Pictures/Wallpapers
backend = awww
monitors = All
fill = fill
auto_exit = True
swww_transition_type = random
swww_transition_duration = 2
swww_transition_fps = 60
language = en
wallpaper = ~/Pictures/Wallpapers/20357689.jpg
show_path_in_tooltip = True
sort = daterev
color = #ffffff
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = wal -i "$wallpaper" -a 80 --backend haishoku && killall -SIGUSR2 waybar

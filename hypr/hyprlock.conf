# hyprlock.conf — minimal config

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/y6d7vfy93m231.jpg
    blur_passes = 1
    blur_size = 2
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
	color = rgba(212, 212, 212, 0.80)
    font_size = 72
    font_family = SF Pro Display Bold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d %B')"
    color = rgba(212, 212, 212, 0.80)
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(102, 92, 84, 0.8)    # gruvbox bg4
    inner_color = rgba(29, 32, 33, 0.8)    # gruvbox bg hard
    font_color = rgba(212, 212, 212, 0.80)
    fade_on_empty = true
    placeholder_text =
    hide_input = false
    rounding = 25
    check_color = rgba(184, 187, 38, 1.0)   # gruvbox yellow
    fail_color = rgba(251, 73, 52, 1.0)     # gruvbox red
    fail_text =
    capslock_color = rgba(250, 189, 47, 1.0)
    position = 0, -120
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/.config/hypr/Icons/user-icon-11.jpg
    size = 120
    rounding = -1                          # -1 = círculo perfecto
    border_size = 0
    border_color = rgba(102, 92, 84, 0.8)  # gruvbox bg4
    position = 0, 0
    halign = center
    valign = center
}
